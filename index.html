<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DirtMC Store</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --dark-green: #003a1a;
    --mid-green: #006b30;
    --light-green: #00b050;
    --accent-green: #39ff14;
    --soft-white: #e8f5e9;
    --card-bg: rgba(0, 40, 20, 0.85);
    --border: rgba(0, 176, 80, 0.3);
    --text: #c8e6c9;
    --star-color: rgba(200,255,200,0.07);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--dark-green);
    color: var(--soft-white);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ===== STARFIELD ===== */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--dur, 4s) var(--delay, 0s) infinite alternate;
    opacity: 0;
  }
  @keyframes twinkle {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: var(--max-op, 0.06); transform: scale(1.2); }
  }

  /* ===== TOP BAR / NAV ===== */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 28px;
    background: rgba(0, 20, 10, 0.9);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2rem;
    color: var(--accent-green);
    text-shadow: 0 0 12px var(--accent-green);
    letter-spacing: 2px;
  }
  .nav-logo .logo-placeholder {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid var(--accent-green);
    background: linear-gradient(135deg, var(--mid-green), var(--dark-green));
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; color: var(--accent-green);
    box-shadow: 0 0 12px rgba(57,255,20,0.4);
  }

  .nav-right {
    display: flex; align-items: center; gap: 14px;
  }
  .cart-btn {
    position: relative;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--soft-white);
    padding: 7px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  .cart-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
  .cart-count {
    position: absolute;
    top: -6px; left: -6px;
    background: var(--accent-green);
    color: #000;
    font-size: 0.7rem;
    font-weight: 900;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .logout-btn {
    background: rgba(255,0,0,0.1);
    border: 1px solid rgba(255,80,80,0.3);
    color: #ff6b6b;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    transition: all .2s;
  }
  .logout-btn:hover { background: rgba(255,0,0,0.2); }

  /* ===== LOGIN OVERLAY ===== */
  #loginOverlay {
    position: fixed; inset: 0;
    z-index: 999;
    background: rgba(0,10,5,0.97);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 28px;
  }
  .login-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 52px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 0 60px rgba(0,176,80,0.15);
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .login-box .logo-big {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 3px solid var(--accent-green);
    background: linear-gradient(135deg, var(--mid-green), var(--dark-green));
    display: flex; align-items: center; justify-content: center;
    font-size: 2.2rem;
    margin: 0 auto 20px;
    box-shadow: 0 0 30px rgba(57,255,20,0.35);
  }
  .login-box h1 {
    font-family: 'Orbitron', sans-serif;
    color: var(--accent-green);
    font-size: 1.6rem;
    text-shadow: 0 0 14px var(--accent-green);
    margin-bottom: 6px;
  }
  .login-box p {
    color: var(--text); font-size: 0.95rem; margin-bottom: 30px;
  }
  .discord-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #5865F2;
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: all .2s;
    box-shadow: 0 4px 20px rgba(88,101,242,0.4);
  }
  .discord-btn:hover { background: #4752c4; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(88,101,242,0.5); }

  /* ===== MAIN CONTENT ===== */
  #mainContent {
    position: relative; z-index: 1;
    padding-top: 80px;
    min-height: 100vh;
    display: none;
  }

  .hero {
    text-align: center;
    padding: 60px 20px 30px;
  }
  .hero h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(1.8rem, 5vw, 3.2rem);
    color: var(--accent-green);
    text-shadow: 0 0 20px rgba(57,255,20,0.5);
    margin-bottom: 10px;
  }
  .hero p { color: var(--text); font-size: 1.05rem; }

  /* ===== ADMIN BAR ===== */
  #adminBar {
    display: none;
    background: rgba(0,30,15,0.9);
    border: 1px solid rgba(57,255,20,0.25);
    border-radius: 14px;
    margin: 20px auto;
    max-width: 900px;
    padding: 16px 22px;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  #adminBar span { color: var(--accent-green); font-weight: 700; font-size: 0.95rem; margin-left: auto; }
  .admin-btn {
    background: rgba(0,176,80,0.15);
    border: 1px solid var(--border);
    color: var(--light-green);
    padding: 8px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    transition: all .2s;
  }

  /* ===== STORE LAYOUT ===== */
  .store-container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
  .category-section { margin-bottom: 48px; }
  .category-header {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 24px;
  }
  .category-header h3 { font-size: 1.3rem; color: var(--light-green); font-weight: 700; }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
  }

  /* ===== PRODUCT CARD ===== */
  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform .25s, box-shadow .25s;
    cursor: pointer;
    position: relative;
    padding-bottom: 15px;
  }
  .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 40px rgba(0,176,80,0.2); }
  .product-img {
    width: 100%; height: 160px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--dark-green), #001a0c);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
  }
  .product-img img { width: 100%; height: 100%; object-fit: cover; }
  .product-body { padding: 14px 16px; }
  .product-name { font-weight: 700; font-size: 1rem; margin-bottom: 6px; color: var(--soft-white); }
  .product-bio { font-size: 0.82rem; color: var(--text); margin-bottom: 10px; line-height: 1.5; }
  .product-footer { display: flex; align-items: center; justify-content: space-between; }
  .product-price { color: var(--accent-green); font-weight: 900; font-size: 1.05rem; }
  .add-to-cart-btn {
    background: var(--mid-green);
    border: none; color: white;
    padding: 10px; border-radius: 8px;
    cursor: pointer; width: 100%;
    margin-top: 10px; font-weight: 700;
  }

  /* ===== CART SIDEBAR ===== */
  #cartOverlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200; display: none;
    align-items: flex-start; justify-content: flex-end;
  }
  .cart-panel {
    background: #001a0c;
    border-right: 1px solid var(--border);
    width: 360px; height: 100vh;
    display: flex; flex-direction: column;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .cart-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
  .cart-items { flex: 1; padding: 16px; overflow-y: auto; }
  .cart-item { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; gap: 10px; }
  .cart-footer { padding: 20px; border-top: 1px solid var(--border); }
  .checkout-btn { width: 100%; background: var(--mid-green); border: none; color: white; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 700; }

  /* ===== TOAST ===== */
  #toast {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,100,40,0.95);
    border: 1px solid var(--light-green);
    color: white; padding: 12px 28px;
    border-radius: 30px; z-index: 999;
    display: none; font-size: 0.95rem;
  }
</style>
</head>
<body>

<div id="starfield"></div>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-box">
    <div class="logo-big">🌿</div>
    <h1>DirtMC Store</h1>
    <p>سجّل دخول بحسابك في ديسكورد لمتابعة التسوق</p>
    <button class="discord-btn" onclick="loginWithDiscord()">تسجيل الدخول عبر Discord</button>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="nav-logo"><div class="logo-placeholder">🌿</div> DirtMC Store</div>
  <div class="nav-right">
    <button class="cart-btn" onclick="openCart()">🛒 السلة <span class="cart-count" id="cartCount">0</span></button>
    <button class="logout-btn" onclick="logout()">خروج</button>
  </div>
</nav>

<!-- MAIN -->
<div id="mainContent">
  <div class="hero">
    <h2>🌿 DirtMC Store</h2>
    <p>مرحباً بك في متجر ديرت - أفضل الخدمات في مكان واحد</p>
  </div>

  <div id="adminBar">
    <span>⚡ لوحة الإدارة</span>
    <button class="admin-btn" onclick="alert('خاصية الإدارة قيد التطوير')">⚙️ الإعدادات</button>
  </div>

  <div class="store-container" id="storeContainer"></div>
</div>

<!-- CART -->
<div id="cartOverlay" onclick="closeCartOnOverlay(event)">
  <div class="cart-panel">
    <div class="cart-header"><h3>🛒 سلة المشتريات</h3><button onclick="closeCart()" style="background:none;border:none;color:white;cursor:pointer;">✕</button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-footer">
      <div style="display:flex;justify-content:space-between;margin-bottom:15px;"><span>المجموع</span><span id="cartTotal" style="color:var(--accent-green)">0$</span></div>
      <button class="checkout-btn" onclick="checkout()">إتمام الدفع 💳</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// الإعدادات الخاصة بك
const OWNER_ID = '1279392021236158566';
const CHECKOUT_LINK = 'https://ptb.discord.com/channels/1409158681232281610/1409440646229393438';

let db = {
  categories: { "c1": { name: "أقسام المتجر", emoji: "💎" } },
  products: {
    "p1": { name: "Discord Nitro", price: "5.00$", bio: "نيترو قيمنق كامل الصلاحيات", catId: "c1" },
    "p2": { name: "Minecraft Account", price: "10.00$", bio: "حساب ماينكرافت أصلي (فول أكسس)", catId: "c1" }
  }
};

let currentUser = JSON.parse(localStorage.getItem('dirtmc_user'));
let cart = [];

window.onload = () => {
  generateStars();
  if (currentUser) showMain();
};

function generateStars() {
  const sf = document.getElementById('starfield');
  for (let i = 0; i < 150; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = `width:2px;height:2px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${Math.random()*5+3}s;--max-op:0.05;`;
    sf.appendChild(s);
  }
}

function loginWithDiscord() {
  const id = prompt("أدخل Discord ID الخاص بك:");
  if (!id) return;
  currentUser = { id: id, isAdmin: (id === OWNER_ID) };
  localStorage.setItem('dirtmc_user', JSON.stringify(currentUser));
  showMain();
}

function logout() {
  localStorage.removeItem('dirtmc_user');
  location.reload();
}

function showMain() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  if (currentUser.isAdmin) document.getElementById('adminBar').style.display = 'flex';
  renderStore();
}

function renderStore() {
  const container = document.getElementById('storeContainer');
  let html = '';
  for (let cId in db.categories) {
    const cat = db.categories[cId];
    html += `<div class="category-section"><div class="category-header"><span>${cat.emoji}</span><h3>${cat.name}</h3></div><div class="products-grid">`;
    for (let pId in db.products) {
      const p = db.products[pId];
      if (p.catId === cId) {
        html += `
          <div class="product-card">
            <div class="product-img">📦</div>
            <div class="product-body">
              <div class="product-name">${p.name}</div>
              <div class="product-bio">${p.bio}</div>
              <div class="product-footer"><span class="product-price">${p.price}</span></div>
              <button class="add-to-cart-btn" onclick="addToCart('${pId}')">🛒 أضف للسلة</button>
            </div>
          </div>`;
      }
    }
    html += `</div></div>`;
  }
  container.innerHTML = html;
}

function addToCart(pId) {
  cart.push(pId);
  document.getElementById('cartCount').innerText = cart.length;
  showToast("تمت الإضافة للسلة ✅");
}

function openCart() {
  document.getElementById('cartOverlay').style.display = 'flex';
  renderCart();
}

function renderCart() {
  const itemsDiv = document.getElementById('cartItems');
  let total = 0;
  itemsDiv.innerHTML = cart.map(pId => {
    const p = db.products[pId];
    total += parseFloat(p.price);
    return `<div class="cart-item"><span>📦</span><div><div>${p.name}</div><div style="color:var(--accent-green)">${p.price}</div></div></div>`;
  }).join('');
  document.getElementById('cartTotal').innerText = total.toFixed(2) + '$';
}

function closeCart() { document.getElementById('cartOverlay').style.display = 'none'; }
function closeCartOnOverlay(e) { if (e.target.id === 'cartOverlay') closeCart(); }

function checkout() {
  if (cart.length === 0) return alert("السلة فارغة!");
  showToast("يتم توجيهك للديسكورد...");
  setTimeout(() => window.open(CHECKOUT_LINK, '_blank'), 1500);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
</html>
