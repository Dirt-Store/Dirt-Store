<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DirtMC Store — Premium Minecraft marketplace">
<meta name="theme-color" content="#080c09">
<title>DirtMC Store</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Changa:wght@400;700&display=swap" rel="stylesheet">

<style>
/* ── التصميم العام (Minecraft Style) ─────────────────────── */
:root {
  --mc-green: #2ecc71;
  --mc-dark-green: #27ae60;
  --mc-stone: #c6c6c6;
  --mc-dark-stone: #7e7e7e;
  --mc-shadow: #3c3c3c;
  --bg-color: #080c09;
  --text-color: #e8f5ed;
  
  --font-pixel: 'VT323', monospace;
  --font-arabic: 'Changa', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-color);
  color: var(--text-color);
  font-family: var(--font-arabic);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── الهيدر ─────────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 30px;
  background: #1e1e1e;
  border-bottom: 4px solid var(--mc-dark-stone);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.logo {
  font-family: var(--font-pixel);
  font-size: 2.2rem;
  color: var(--mc-green);
  text-shadow: 3px 3px 0px #000;
  letter-spacing: 1px;
}

.h-right { display: flex; align-items: center; gap: 15px; }

/* ── الأزرار (Minecraft Button Look) ────────────────────── */
.btn {
  font-family: var(--font-pixel);
  font-size: 1.4rem;
  padding: 8px 18px;
  border: 3px solid #000;
  background: var(--mc-dark-stone);
  color: #fff;
  cursor: pointer;
  text-shadow: 2px 2px 0px #333;
  box-shadow: inset -3px -3px 0px #4a4a4a, inset 3px 3px 0px #bebebe;
  transition: all 0.1s;
}

.btn:hover {
  background: var(--mc-green);
  box-shadow: inset -3px -3px 0px var(--mc-dark-green), inset 3px 3px 0px #95eb95;
}

.btn-primary {
  background: var(--mc-dark-green);
  box-shadow: inset -3px -3px 0px #1a6b3c, inset 3px 3px 0px var(--mc-green);
}

/* ── الواجهة الرئيسية ───────────────────────────────────── */
.hero {
  text-align: center;
  padding: 60px 20px;
  background: linear-gradient(to bottom, rgba(46,204,113,0.08), transparent);
}

.hero h1 {
  font-family: var(--font-pixel);
  font-size: 4rem;
  color: var(--mc-green);
  text-shadow: 4px 4px 0px #000;
  margin-bottom: 10px;
}

.hero p { color: #6d9e7a; font-size: 1.1rem; }

.store { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }

#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 25px;
}

/* ── الكروت ────────────────────────────────────────────── */
.card {
  background: #181818;
  border: 4px solid var(--mc-shadow);
  padding: 8px;
  position: relative;
  transition: transform 0.1s;
}

.card:hover { border-color: var(--mc-green); transform: translateY(-5px); }

.card-img-wrap {
  width: 100%;
  aspect-ratio: 1/1;
  background: #000;
  margin-bottom: 12px;
  border: 2px solid #222;
}

.card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

.card-body { text-align: center; }

.card-name {
  font-family: var(--font-pixel);
  font-size: 1.6rem;
  color: #fff;
  margin-bottom: 8px;
  text-shadow: 2px 2px 0px #000;
}

.card-price {
  font-family: var(--font-pixel);
  font-size: 1.4rem;
  color: var(--mc-green);
  margin-bottom: 15px;
}

/* ── النوافذ المنبثقة (Modals) ─────────────────────────── */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 2000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.overlay.open { display: flex; }

.modal {
  background: var(--mc-stone);
  border: 4px solid #000;
  box-shadow: inset -4px -4px 0px #555, inset 4px 4px 0px #fff;
  width: 100%;
  max-width: 420px;
  color: #333;
  padding: 25px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  border-bottom: 3px solid #555;
  padding-bottom: 10px;
}

.modal-title { font-family: var(--font-pixel); font-size: 1.8rem; color: #000; }

.form-group { margin-bottom: 15px; }

.form-label { display: block; margin-bottom: 8px; font-weight: bold; }

.form-input {
  width: 100%;
  background: #000;
  border: 3px solid #555;
  color: var(--mc-green);
  padding: 12px;
  font-family: var(--font-pixel);
  font-size: 1.3rem;
  outline: none;
}

.form-error { color: #aa0000; font-family: var(--font-pixel); font-size: 1.1rem; margin-top: 5px; }

/* ── تأثيرات البحث ─────────────────────────────────────── */
.search-container { max-width: 400px; margin: 0 auto 30px; }
.search-input { width: 100%; background: #111; border: 3px solid var(--mc-shadow); padding: 10px; color: #fff; font-family: var(--font-pixel); font-size: 1.2rem; }

</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">DirtMC Store</div>
    <div class="h-right">
      <div id="logged-in-user" style="display:none; font-family: var(--font-pixel); font-size: 1.2rem;">
        أهلاً، <span id="userNameDisplay" style="color:var(--mc-green)"></span>
      </div>
      <button class="btn" id="loginBtn" onclick="openModal('loginModal')">تسجيل الدخول</button>
    </div>
  </header>

  <section class="hero">
    <h1>DirtMC Store</h1>
    <p>المتجر الرسمي للسيرفر - كل ما تحتاجه في مكان واحد</p>
  </section>

  <section class="store">
    <div class="search-container">
      <input type="text" class="search-input" placeholder="البحث عن منتج..." id="searchInput">
    </div>
    <div id="grid">
      </div>
  </section>
</div>

<div class="overlay" id="loginModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">تسجيل الدخول</span>
      <button style="background:none; border:none; cursor:pointer; font-size:1.5rem;" onclick="closeModal('loginModal')">✕</button>
    </div>
    
    <div id="auth-step">
      <div class="form-group">
        <label class="form-label">البريد الإلكتروني</label>
        <input class="form-input" id="loginEmail" type="email" value="moradmorad461@gmail.com" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input class="form-input" id="loginPassword" type="password" placeholder="Password">
      </div>
      <div class="form-error" id="loginErr"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="verifyAuth()">دخول</button>
    </div>

    <div id="username-step" style="display:none">
      <div class="form-group">
        <label class="form-label">اسمك داخل السيرفر</label>
        <input class="form-input" id="usernameInput" placeholder="Minecraft Username">
      </div>
      <div class="form-error" id="usernameErr"></div>
      <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="completeLogin()">ابدأ التسوق</button>
    </div>
  </div>
</div>

<script>
// --- البيانات الثابتة ---
const ADMIN_EMAIL = "moradmorad461@gmail.com";
const ADMIN_PASS = "531531morad";

// --- المنتجات (مثال) ---
const products = [
  { id: 1, name: "VIP RANK", price: "$10.00", img: "https://placehold.co/400x400/000/2ecc71?text=VIP" },
  { id: 2, name: "LEGEND RANK", price: "$25.00", img: "https://placehold.co/400x400/000/2ecc71?text=LEGEND" },
  { id: 3, name: "SPAWHNER KEY", price: "$5.00", img: "https://placehold.co/400x400/000/2ecc71?text=KEY" }
];

// --- الوظائف الأساسية ---
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// رندر المنتجات
function renderProducts(filter = "") {
  const grid = document.getElementById('grid');
  grid.innerHTML = "";
  products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase())).forEach(p => {
    grid.innerHTML += `
      <div class="card">
        <div class="card-img-wrap">
          <img src="${p.img}" alt="${p.name}">
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-price">${p.price}</div>
          <button class="btn btn-primary" style="width:100%" onclick="alert('تواصل معنا في الديسكورد للشراء')">شراء</button>
        </div>
      </div>
    `;
  });
}

// التحقق من الدخول
function verifyAuth() {
  const pass = document.getElementById('loginPassword').value;
  const err = document.getElementById('loginErr');
  
  if (pass === ADMIN_PASS) {
    document.getElementById('auth-step').style.display = 'none';
    document.getElementById('username-step').style.display = 'block';
  } else {
    err.textContent = "كلمة المرور غير صحيحة!";
  }
}

// إتمام الدخول
function completeLogin() {
  const user = document.getElementById('usernameInput').value;
  if (user.trim().length < 3) {
    document.getElementById('usernameErr').textContent = "الاسم قصير جداً!";
    return;
  }
  
  document.getElementById('loginBtn').style.display = 'none';
  document.getElementById('logged-in-user').style.display = 'block';
  document.getElementById('userNameDisplay').textContent = user;
  closeModal('loginModal');
}

// البحث
document.getElementById('searchInput').addEventListener('input', (e) => {
  renderProducts(e.target.value);
});

// التشغيل الأولي
renderProducts();
</script>

</body>
</html>
