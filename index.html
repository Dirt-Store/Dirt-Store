<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DirtMC Store</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --dark-green: #0a1a0e;
    --mid-green: #0f2d15;
    --green: #1a4d22;
    --light-green: #2d7a3a;
    --bright-green: #4CAF50;
    --neon-green: #56ff6a;
    --white: #f0f9f1;
    --soft-white: rgba(240,249,241,0.85);
    --card-bg: rgba(15,45,21,0.85);
    --border: rgba(76,175,80,0.25);
    --glow: 0 0 20px rgba(86,255,106,0.15);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--dark-green);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Stars background */
  #stars-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
  }

  /* ============ LOGIN OVERLAY ============ */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0f2d15 0%, #050f07 100%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }

  .login-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .login-logo .store-icon {
    width: 90px;
    height: 90px;
    background: linear-gradient(135deg, var(--bright-green), var(--neon-green));
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    box-shadow: 0 0 40px rgba(86,255,106,0.4);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%,100% { box-shadow: 0 0 40px rgba(86,255,106,0.4); }
    50% { box-shadow: 0 0 70px rgba(86,255,106,0.7); }
  }

  .login-logo h1 {
    font-family: 'Orbitron', monospace;
    font-size: 2.2rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--bright-green), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
  }

  .login-logo p {
    color: rgba(240,249,241,0.5);
    font-size: 0.95rem;
    letter-spacing: 1px;
  }

  .login-box {
    background: rgba(15,45,21,0.9);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    backdrop-filter: blur(20px);
    box-shadow: var(--glow);
  }

  .login-box h2 {
    font-size: 1.4rem;
    margin-bottom: 10px;
    color: var(--white);
  }

  .login-box p {
    color: rgba(240,249,241,0.5);
    font-size: 0.9rem;
    margin-bottom: 28px;
  }

  .discord-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #5865F2;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-size: 1rem;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }

  .discord-btn:hover {
    background: #4752C4;
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(88,101,242,0.4);
  }

  .discord-btn svg { width: 22px; height: 22px; fill: white; flex-shrink: 0; }

  /* ============ MAIN APP ============ */
  #app { display: none; position: relative; z-index: 1; min-height: 100vh; }

  /* ============ NAVBAR ============ */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(10,26,14,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .nav-left { display: flex; align-items: center; gap: 14px; }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .nav-logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--bright-green), var(--neon-green));
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    box-shadow: 0 0 15px rgba(86,255,106,0.3);
  }

  .nav-logo-text {
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--bright-green), var(--neon-green));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 2px;
  }

  .nav-discord-link {
    display: flex;
    align-items: center;
    gap: 7px;
    background: rgba(88,101,242,0.15);
    border: 1px solid rgba(88,101,242,0.3);
    color: #7289da;
    text-decoration: none;
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    transition: all 0.3s;
  }

  .nav-discord-link:hover {
    background: rgba(88,101,242,0.3);
    color: white;
    transform: translateY(-1px);
  }

  .nav-discord-link svg { width: 18px; height: 18px; fill: currentColor; }

  .nav-right { display: flex; align-items: center; gap: 12px; }

  .user-pill {
    display: flex;
    align-items: center;
    gap: 9px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 6px 14px 6px 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .user-pill:hover { border-color: var(--bright-green); }

  .user-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--bright-green), var(--neon-green));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--dark-green);
    overflow: hidden;
  }

  .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

  .user-name { font-size: 0.85rem; font-weight: 700; }

  .admin-badge {
    background: linear-gradient(90deg, var(--bright-green), var(--neon-green));
    color: var(--dark-green);
    font-size: 0.65rem;
    font-weight: 900;
    padding: 2px 7px;
    border-radius: 50px;
    letter-spacing: 0.5px;
  }

  .cart-btn {
    position: relative;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 14px;
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.2s;
    color: var(--white);
  }

  .cart-btn:hover { border-color: var(--bright-green); transform: scale(1.05); }

  .cart-count {
    position: absolute;
    top: -5px; left: -5px;
    background: var(--neon-green);
    color: var(--dark-green);
    font-size: 0.65rem;
    font-weight: 900;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    display: none;
  }

  .logout-btn {
    background: rgba(255,60,60,0.1);
    border: 1px solid rgba(255,60,60,0.2);
    color: #ff6b6b;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }

  .logout-btn:hover { background: rgba(255,60,60,0.2); }

  /* ============ MAIN CONTENT ============ */
  .main-content { padding-top: 80px; padding-bottom: 60px; }

  /* ============ HERO ============ */
  .hero {
    padding: 60px 28px 40px;
    text-align: center;
    position: relative;
  }

  .hero-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(90deg, var(--bright-green) 0%, var(--neon-green) 50%, var(--bright-green) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 3px;
    margin-bottom: 12px;
    animation: shimmer 3s linear infinite;
    background-size: 200% auto;
  }

  @keyframes shimmer {
    0% { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .hero-sub {
    color: rgba(240,249,241,0.5);
    font-size: 1rem;
    letter-spacing: 1px;
  }

  /* ============ ADMIN PANEL ============ */
  #admin-panel {
    display: none;
    margin: 0 28px 40px;
    background: var(--card-bg);
    border: 1px solid rgba(76,175,80,0.3);
    border-radius: 20px;
    padding: 28px;
    backdrop-filter: blur(10px);
  }

  .admin-panel-title {
    font-family: 'Orbitron', monospace;
    font-size: 1rem;
    color: var(--neon-green);
    letter-spacing: 2px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .admin-actions { display: flex; flex-wrap: wrap; gap: 14px; }

  .admin-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 22px;
    border-radius: 12px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    border: none;
  }

  .admin-btn-green {
    background: linear-gradient(135deg, var(--bright-green), var(--light-green));
    color: white;
  }

  .admin-btn-green:hover {
    background: linear-gradient(135deg, var(--neon-green), var(--bright-green));
    color: var(--dark-green);
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(86,255,106,0.25);
  }

  .admin-btn-outline {
    background: transparent;
    border: 1px solid var(--border) !important;
    color: var(--soft-white);
  }

  .admin-btn-outline:hover {
    border-color: var(--bright-green) !important;
    color: var(--neon-green);
    transform: translateY(-2px);
  }

  /* ============ STORE GRID ============ */
  .store-wrap { padding: 0 28px; }

  .category-section { margin-bottom: 48px; }

  .category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .category-name {
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    color: var(--neon-green);
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .category-name::before {
    content: '';
    width: 4px; height: 20px;
    background: var(--neon-green);
    border-radius: 2px;
    box-shadow: 0 0 10px var(--neon-green);
  }

  .admin-cat-actions { display: flex; gap: 8px; }

  .mini-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--soft-white);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.75rem;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-weight: 700;
    transition: all 0.2s;
  }

  .mini-btn:hover { border-color: var(--bright-green); color: var(--neon-green); }

  .mini-btn-danger:hover { border-color: #ff6b6b !important; color: #ff6b6b !important; }

  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
  }

  /* ============ PRODUCT CARD ============ */
  .product-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    backdrop-filter: blur(10px);
  }

  .product-card:hover {
    transform: translateY(-5px);
    border-color: rgba(76,175,80,0.5);
    box-shadow: 0 15px 40px rgba(0,0,0,0.3), 0 0 20px rgba(76,175,80,0.1);
  }

  .product-img {
    width: 100%; height: 160px;
    object-fit: cover;
    display: block;
    background: linear-gradient(135deg, var(--mid-green), var(--green));
  }

  .product-img-placeholder {
    width: 100%; height: 160px;
    background: linear-gradient(135deg, var(--mid-green), var(--green));
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
  }

  .product-info { padding: 16px; }

  .product-name {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--white);
  }

  .product-bio {
    font-size: 0.82rem;
    color: rgba(240,249,241,0.5);
    margin-bottom: 12px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .product-price {
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--neon-green);
  }

  .product-stock {
    font-size: 0.72rem;
    color: rgba(240,249,241,0.4);
    background: rgba(255,255,255,0.05);
    padding: 3px 8px;
    border-radius: 6px;
  }

  .buy-btn {
    width: 100%;
    margin-top: 12px;
    background: linear-gradient(135deg, var(--bright-green), var(--light-green));
    border: none;
    border-radius: 10px;
    color: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 10px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.5px;
  }

  .buy-btn:hover {
    background: linear-gradient(135deg, var(--neon-green), var(--bright-green));
    color: var(--dark-green);
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(86,255,106,0.25);
  }

  .admin-card-actions {
    display: flex; gap: 6px;
    padding: 0 16px 14px;
  }

  .card-mini-btn {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: none;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .card-edit-btn { background: rgba(76,175,80,0.15); color: var(--bright-green); border: 1px solid rgba(76,175,80,0.3) !important; }
  .card-edit-btn:hover { background: rgba(76,175,80,0.3); }

  .card-del-btn { background: rgba(255,60,60,0.1); color: #ff6b6b; border: 1px solid rgba(255,60,60,0.2) !important; }
  .card-del-btn:hover { background: rgba(255,60,60,0.2); }

  /* ============ MODAL ============ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(5,15,7,0.85);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.active { opacity: 1; pointer-events: all; }

  .modal {
    background: #0d2411;
    border: 1px solid rgba(76,175,80,0.3);
    border-radius: 20px;
    padding: 32px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    transform: scale(0.95) translateY(20px);
    transition: transform 0.25s;
  }

  .modal-overlay.active .modal { transform: scale(1) translateY(0); }

  .modal h3 {
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    color: var(--neon-green);
    letter-spacing: 2px;
    margin-bottom: 24px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .modal-close {
    background: transparent; border: none;
    color: rgba(240,249,241,0.4);
    font-size: 1.2rem; cursor: pointer;
    transition: color 0.2s;
    font-family: monospace;
  }

  .modal-close:hover { color: var(--white); }

  .form-group { margin-bottom: 18px; }

  .form-group label {
    display: block;
    font-size: 0.85rem;
    color: rgba(240,249,241,0.6);
    margin-bottom: 7px;
    font-weight: 700;
  }

  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--white);
    padding: 11px 14px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    outline: none;
  }

  .form-input:focus { border-color: var(--bright-green); }
  .form-input::placeholder { color: rgba(240,249,241,0.25); }

  textarea.form-input { resize: vertical; min-height: 90px; }

  .form-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--bright-green), var(--light-green));
    border: none; border-radius: 12px;
    color: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 13px;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.25s;
    letter-spacing: 0.5px;
  }

  .form-submit:hover {
    background: linear-gradient(135deg, var(--neon-green), var(--bright-green));
    color: var(--dark-green);
    box-shadow: 0 8px 24px rgba(86,255,106,0.3);
  }

  /* ============ CART MODAL ============ */
  .cart-items { margin-bottom: 20px; }

  .cart-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .cart-item-img {
    width: 52px; height: 52px;
    border-radius: 10px;
    object-fit: cover;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
    overflow: hidden;
  }

  .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }

  .cart-item-info { flex: 1; }

  .cart-item-name { font-weight: 700; font-size: 0.9rem; }
  .cart-item-price { color: var(--neon-green); font-family: 'Orbitron', monospace; font-size: 0.85rem; }

  .qty-controls {
    display: flex; align-items: center; gap: 8px;
  }

  .qty-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--white);
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1rem; font-weight: 700;
    transition: all 0.2s;
  }

  .qty-btn:hover { border-color: var(--bright-green); color: var(--neon-green); }
  .qty-num { font-weight: 700; min-width: 20px; text-align: center; }

  .cart-total {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0;
    border-top: 1px solid rgba(76,175,80,0.2);
    margin-bottom: 16px;
  }

  .cart-total span:first-child { font-size: 0.9rem; color: rgba(240,249,241,0.6); }
  .cart-total span:last-child { font-family: 'Orbitron', monospace; font-size: 1.2rem; color: var(--neon-green); font-weight: 700; }

  .checkout-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--bright-green), var(--light-green));
    border: none; border-radius: 12px;
    color: white;
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 1px;
  }

  .checkout-btn:hover {
    background: linear-gradient(135deg, var(--neon-green), var(--bright-green));
    color: var(--dark-green);
    box-shadow: 0 8px 24px rgba(86,255,106,0.3);
  }

  .cart-empty {
    text-align: center;
    color: rgba(240,249,241,0.35);
    padding: 30px 0;
    font-size: 0.9rem;
  }

  /* ============ TOAST ============ */
  #toast {
    position: fixed;
    bottom: 30px; right: 30px;
    background: #0d2411;
    border: 1px solid rgba(76,175,80,0.4);
    border-radius: 12px;
    padding: 14px 22px;
    color: var(--white);
    font-size: 0.9rem;
    font-weight: 700;
    z-index: 9999;
    transform: translateX(120%);
    transition: transform 0.3s ease;
    box-shadow: var(--glow);
    max-width: 300px;
  }

  #toast.show { transform: translateX(0); }

  /* ============ FOOTER ============ */
  footer {
    text-align: center;
    padding: 30px;
    color: rgba(240,249,241,0.25);
    font-size: 0.8rem;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }

  /* ============ SCROLLBAR ============ */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--dark-green); }
  ::-webkit-scrollbar-thumb { background: var(--green); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bright-green); }

  /* ============ EMPTY STATE ============ */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: rgba(240,249,241,0.25);
  }

<div id="toast"></div>

<script>
// ============ STATE ============
const OWNER_ID = '1279392021236158566';
// ⬇️ غيّر هذا الرابط لرابط الهوست الخاص بك
const API_URL = 'http://localhost:3001';

let state = {
  loggedIn: false,
  user: null,
  categories: JSON.parse(localStorage.getItem('dmc_categories') || '[]'),
  products: JSON.parse(localStorage.getItem('dmc_products') || '[]'),
  admins: [OWNER_ID],
  cart: []
};

// جلب قائمة الأدمن من البوت
async function fetchAdmins() {
  try {
    const res = await fetch(API_URL + '/api/admins');
    if (res.ok) {
      const data = await res.json();
      state.admins = data.admins || [OWNER_ID];
    }
  } catch (e) {
    // لو البوت مو شغال نرجع للمالك الأساسي
    state.admins = [OWNER_ID];
  }
}

function saveData() {
  localStorage.setItem('dmc_categories', JSON.stringify(state.categories));
  localStorage.setItem('dmc_products', JSON.stringify(state.products));
  localStorage.setItem('dmc_admins', JSON.stringify(state.admins));
}

// ============ STARS ============
(function() {
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initStars() {
    stars = [];
    for (let i = 0; i < 120; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.2 + 0.2,
        alpha: Math.random() * 0.5 + 0.1,
        speed: Math.random() * 0.3 + 0.05
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,255,210,${s.alpha})`;
      ctx.fill();
      s.alpha += s.speed * 0.015 * (Math.random() > 0.5 ? 1 : -1);
      s.alpha = Math.max(0.05, Math.min(0.6, s.alpha));
    });
    requestAnimationFrame(draw);
  }

  resize();
  initStars();
  draw();
  window.addEventListener('resize', () => { resize(); initStars(); });
})();

// ============ LOGIN ============
async function loginWithDiscord() {
  // Simulate Discord OAuth — in real deployment you'd use Discord OAuth2
  const mockUser = {
    id: prompt('أدخل ديسكورد ID الخاص بك (للتجربة):', '123456789') || '123456789',
    name: prompt('أدخل اسمك:', 'Player') || 'Player',
    avatar: null
  };

  mockUser.isAdmin = state.admins.includes(mockUser.id);
  state.user = mockUser;
  state.loggedIn = true;

  document.getElementById('login-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  // Update UI
  document.getElementById('user-name-display').textContent = mockUser.name;
  if (mockUser.avatar) {
    document.getElementById('user-avatar').innerHTML = `<img src="${mockUser.avatar}" alt="">`;
  } else {
    document.getElementById('user-avatar').textContent = mockUser.name[0].toUpperCase();
  }

  if (mockUser.isAdmin) {
    document.getElementById('admin-badge').style.display = 'inline';
    document.getElementById('admin-panel').style.display = 'block';
  }

  renderStore();
  showToast(`مرحباً ${mockUser.name}! 👋`);
}

function logout() {
  state.loggedIn = false;
  state.user = null;
  state.cart = [];
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'none';
  updateCartCount();
}

// ============ RENDER STORE ============
function renderStore() {
  const wrap = document.getElementById('store-wrap');
  const isAdmin = state.user && state.user.isAdmin;

  if (state.categories.length === 0) {
    wrap.innerHTML = `<div class="empty-state"><div class="es-icon">📦</div><p>${isAdmin ? 'لا توجد كاتيجوريات بعد. أضف كاتيجوري من لوحة الإدارة!' : 'المتجر فارغ حالياً، ارجع لاحقاً!'}</p></div>`;
    return;
  }

  wrap.innerHTML = '';
  state.categories.forEach(cat => {
    const catProducts = state.products.filter(p => p.catId === cat.id);
    const section = document.createElement('div');
    section.className = 'category-section';

    const adminCatBtns = isAdmin ? `
      <div class="admin-cat-actions">
        <button class="mini-btn" onclick="openAddProductInCat('${cat.id}')">➕ منتج</button>
        <button class="mini-btn mini-btn-danger" onclick="deleteCategory('${cat.id}')">🗑️ حذف</button>
      </div>` : '';

    let productsHTML = '';
    if (catProducts.length === 0) {
      productsHTML = `<div class="empty-state" style="padding:24px 0"><p>لا توجد منتجات في هذا القسم</p></div>`;
    } else {
      productsHTML = `<div class="products-grid">` +
        catProducts.map(p => renderProductCard(p, isAdmin)).join('') +
        `</div>`;
    }

    section.innerHTML = `
      <div class="category-header">
        <div class="category-name">${cat.name}</div>
        ${adminCatBtns}
      </div>
      ${productsHTML}
    `;
    wrap.appendChild(section);
  });
}

function renderProductCard(p, isAdmin) {
  const imgHTML = p.img
    ? `<img class="product-img" src="${p.img}" alt="${p.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const placeholderHTML = `<div class="product-img-placeholder" style="${p.img ? 'display:none' : ''}">📦</div>`;

  const adminActions = isAdmin ? `
    <div class="admin-card-actions">
      <button class="card-mini-btn card-edit-btn" onclick="openEditProduct('${p.id}')">✏️ تعديل</button>
      <button class="card-mini-btn card-del-btn" onclick="deleteProduct('${p.id}')">🗑️ حذف</button>
    </div>` : '';

  const stockLabel = p.qty !== null && p.qty !== undefined && p.qty !== ''
    ? `<span class="product-stock">الكمية: ${p.qty}</span>`
    : `<span class="product-stock">∞ لا محدودة</span>`;

  return `
    <div class="product-card-outer">
      <div class="product-card">
        ${imgHTML}
        ${placeholderHTML}
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-bio">${p.bio || 'لا يوجد وصف'}</div>
          <div class="product-footer">
            <div class="product-price">${parseFloat(p.price).toFixed(2)} SAR</div>
            ${stockLabel}
          </div>
          <button class="buy-btn" onclick="addToCart('${p.id}')">أضف إلى السلة 🛒</button>
        </div>
        ${adminActions}
      </div>
    </div>`;
}

// ============ CATEGORIES ============
function openAddCategory() {
  document.getElementById('cat-name').value = '';
  openModal('modal-add-category');
}

function addCategory() {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) { showToast('❌ أدخل اسم الكاتيجوري'); return; }
  state.categories.push({ id: Date.now().toString(), name });
  saveData();
  closeModal('modal-add-category');
  renderStore();
  showToast('✅ تم إضافة الكاتيجوري');
}

function deleteCategory(id) {
  if (!confirm('هل تريد حذف هذا القسم وكل منتجاته؟')) return;
  state.categories = state.categories.filter(c => c.id !== id);
  state.products = state.products.filter(p => p.catId !== id);
  saveData();
  renderStore();
  showToast('🗑️ تم حذف الكاتيجوري');
}

// ============ PRODUCTS ============
function openAddProduct(catId) {
  document.getElementById('product-modal-title').innerHTML = 'إضافة منتج <button class="modal-close" onclick="closeModal(\'modal-add-product\')">✕</button>';
  document.getElementById('prod-name').value = '';
  document.getElementById('prod-price').value = '';
  document.getElementById('prod-img').value = '';
  document.getElementById('prod-bio').value = '';
  document.getElementById('prod-qty').value = '';
  document.getElementById('prod-edit-id').value = '';
  populateCatSelect(catId);
  openModal('modal-add-product');
}

function openAddProductInCat(catId) { openAddProduct(catId); }

function openEditProduct(id) {
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  document.getElementById('product-modal-title').innerHTML = 'تعديل المنتج <button class="modal-close" onclick="closeModal(\'modal-add-product\')">✕</button>';
  document.getElementById('prod-name').value = p.name;
  document.getElementById('prod-price').value = p.price;
  document.getElementById('prod-img').value = p.img || '';
  document.getElementById('prod-bio').value = p.bio || '';
  document.getElementById('prod-qty').value = p.qty !== null ? p.qty : '';
  document.getElementById('prod-edit-id').value = id;
  populateCatSelect(p.catId);
  openModal('modal-add-product');
}

function populateCatSelect(selectedId) {
  const sel = document.getElementById('prod-cat');
  sel.innerHTML = state.categories.map(c =>
    `<option value="${c.id}" ${c.id === selectedId ? 'selected' : ''}>${c.name}</option>`
  ).join('');
}

function saveProduct() {
  const name = document.getElementById('prod-name').value.trim();
  const price = document.getElementById('prod-price').value;
  const img = document.getElementById('prod-img').value.trim();
  const bio = document.getElementById('prod-bio').value.trim();
  const qtyRaw = document.getElementById('prod-qty').value.trim();
  const catId = document.getElementById('prod-cat').value;
  const editId = document.getElementById('prod-edit-id').value;

  if (!name) { showToast('❌ أدخل اسم المنتج'); return; }
  if (!price || isNaN(price)) { showToast('❌ أدخل سعر صحيح'); return; }
  if (!catId) { showToast('❌ اختر كاتيجوري'); return; }

  const qty = qtyRaw === '' ? null : parseInt(qtyRaw);

  if (editId) {
    const idx = state.products.findIndex(p => p.id === editId);
    if (idx !== -1) {
      state.products[idx] = { ...state.products[idx], name, price: parseFloat(price), img, bio, qty, catId };
    }
    showToast('✅ تم تعديل المنتج');
  } else {
    state.products.push({ id: Date.now().toString(), name, price: parseFloat(price), img, bio, qty, catId });
    showToast('✅ تم إضافة المنتج');
  }

  saveData();
  closeModal('modal-add-product');
  renderStore();
}

function deleteProduct(id) {
  if (!confirm('هل تريد حذف هذا المنتج؟')) return;
  state.products = state.products.filter(p => p.id !== id);
  saveData();
  renderStore();
  showToast('🗑️ تم حذف المنتج');
}

// ============ CART ============
function addToCart(productId) {
  const p = state.products.find(x => x.id === productId);
  if (!p) return;
  const existing = state.cart.find(x => x.id === productId);
  if (existing) {
    existing.qty++;
  } else {
    state.cart.push({ id: productId, name: p.name, price: p.price, img: p.img, qty: 1 });
  }
  updateCartCount();
  showToast(`🛒 تمت الإضافة: ${p.name}`);
}

function updateCartCount() {
  const total = state.cart.reduce((s, i) => s + i.qty, 0);
  const badge = document.getElementById('cart-count');
  badge.textContent = total;
  badge.style.display = total > 0 ? 'flex' : 'none';
}

function openCart() {
  const list = document.getElementById('cart-items-list');
  if (state.cart.length === 0) {
    list.innerHTML = '<div class="cart-empty">🛒 السلة فارغة</div>';
    document.getElementById('cart-total-price').textContent = '0 SAR';
  } else {
    list.innerHTML = state.cart.map(item => `
      <div class="cart-item">
        <div class="cart-item-img">
          ${item.img ? `<img src="${item.img}" alt="" onerror="this.style.display='none'">` : '📦'}
        </div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">${(item.price * item.qty).toFixed(2)} SAR</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
          <span class="qty-num">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
        </div>
      </div>
    `).join('');
    const total = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
    document.getElementById('cart-total-price').textContent = `${total.toFixed(2)} SAR`;
  }
  openModal('modal-cart');
}

function changeQty(id, delta) {
  const item = state.cart.find(x => x.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) state.cart = state.cart.filter(x => x.id !== id);
  updateCartCount();
  openCart(); // refresh cart UI
}

function checkout() {
  if (state.cart.length === 0) { showToast('❌ السلة فارغة!'); return; }
  closeModal('modal-cart');
  showToast('🎫 لإكمال الشراء يرجى فتح تذكرة');
  setTimeout(() => {
    window.open('https://ptb.discord.com/channels/1409158681232281610/1409440646229393438', '_blank');
  }, 800);
}

// ============ MODALS ============
function openModal(id) {
  document.getElementById(id).classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
  document.body.style.overflow = '';
}

// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ============ TOAST ============
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
